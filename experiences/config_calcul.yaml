# Le pilotage des calculs sur vast.ai, programme « Raisons ou regard ? » (3 octobre 2026).
# Décision 4 (passation v1.3, §2) : un H100 SXM quand il y en a, sinon un A100 80 Go, et plusieurs GPU à la fois.
# Les règles de vast.ai : aucune clé de l'API Claude sur ces machines ; un jeton Hugging Face à accès restreint,
# révoqué ensuite ; les données et les points de contrôle dans un stockage de Lazar (ici, le dépôt privé de résultats).
# Ce qui est une proposition est marqué « proposition ».

# L'image officielle de PyTorch (Docker Hub, publiée le 30 septembre 2026) : torch 2.14.1, CUDA 12.6.
image: "pytorch/pytorch:2.14.1-cuda12.6-cudnn9-runtime"
disk_gb: 120                 # proposition : Llama-3.1-8B-Instruct fait environ 16 Go ; place pour les points de contrôle

# Les types de GPU, dans l'ordre de préférence. Les noms sont ceux de vast.ai ; gpu_ram en Go.
# Noms vérifiés le 3 octobre 2026 sur une recherche réelle (centres de données, 1 GPU) : H100 SXM, 2 offres dès
# 2,96 $/h ; A100 SXM4 80 Go, 3 offres dès 1,11 $/h ; A100 PCIE 80 Go, aucune (une hors centre de données).
gpus:
  - {name: "H100 SXM"}
  - {name: "A100 SXM4", min_gpu_ram_gb: 79}
  - {name: "A100 PCIE", min_gpu_ram_gb: 79}

filters:
  reliability_min: 0.95      # proposition ; 0,98 jusqu'au 5 octobre 2026, où aucune offre ne passait (un A100 SXM4 à 0,95)
  inet_down_min_mbps: 500    # proposition : le téléchargement du modèle
  cuda_min: 12.6             # l'image demande un pilote qui porte CUDA 12.6
  datacenter_only: true      # proposition : seulement des machines de centres de données, puisque le jeton HF y va

max_dph_per_gpu: 4.0         # proposition : prix horaire au plus, par GPU, en dollars
# Le choix de l'offre (décision 41, 8 octobre 2026). vast.ai facture la bande passante à part du prix horaire : 0,039 $
# par Go téléchargé sur le H100 de composite_check-20261008-075025-3d6a, soit environ 2,7 $ pour ses 70 Go de modèles,
# contre 0,83 $ de location. Parmi les offres du premier type de GPU qui en a, on prend donc la moins chère pour le run :
# le prix horaire sur la durée attendue, plus le prix du téléchargement sur le volume du job. Les durées sont des
# estimations ; les volumes sont ceux des modèles, lus sur Hugging Face le 8 octobre 2026 (l'image n'est pas comptée).
expected_hours: 1
download_gb: 17              # Llama-3.1-8B-Instruct : 16,1 Go
max_hours_default: 3         # au-delà, le script de la machine coupe le job (timeout), et le conteneur s'arrête
heartbeat_seconds: 600       # 300 jusqu'au 5 octobre 2026 : le dépôt de résultats prend au plus 128 commits par heure

watch:
  poll_seconds: 120
  stale_minutes: 30          # sans battement depuis ce délai : signalé ; au double : machine détruite
  loading_minutes: 40        # une machine qui n'atteint pas « running » dans ce délai est détruite
  exited_grace_minutes: 4    # un conteneur arrêté sans état final : attendu ce délai, puis détruit (le script écrit l'état final avant de s'arrêter)

# Les paquets des machines, épinglés (versions vérifiées le 3 octobre 2026 ; torch vient de l'image).
requirements: requirements_gpu.txt
# Les réglages propres à un job. La génération par un modèle ouvert tourne sur l'image officielle de vLLM : installé
# par-dessus l'image PyTorch, vLLM 0.30.0 remplace torch par une version pour CUDA 13.0 et laisse un torchaudio pour
# CUDA 12.6, que transformers refuse (essai sdf_documents-20261003-155823-97c2). L'image vllm/vllm-openai:v0.30.0
# existe sur Docker Hub (vérifié le 3 octobre 2026) ; son torch est construit pour CUDA 13.0, d'où le pilote demandé.
job_overrides:
  sdf_documents:
    image: "vllm/vllm-openai:v0.30.0"
    filters: {cuda_min: 13.0}
    expected_hours: 2
    download_gb: 30          # Qwen3-14B : 29,6 Go
  organism:
    expected_hours: 4
  judge_jev:
    download_gb: 55          # JEV-27B : 54,2 Go
  composite_check:
    expected_hours: 0.25
    download_gb: 71          # Llama-3.1-8B-Instruct et JEV-27B
  organism_inhibition:
    expected_hours: 4
    download_gb: 71          # avec le composite, JEV-27B en plus de Llama
  # Le générateur ouvert des données des bras (décision 37, 8 octobre 2026) : la même image ; de la place pour un
  # modèle d'environ 125 Go (Qwen3.5-122B-A10B en FP8, proposé), sur plusieurs GPU (--gpus).
  open_generate:
    image: "vllm/vllm-openai:v0.30.0"
    filters: {cuda_min: 13.0}
    disk_gb: 400
    # Décision 43 (8 octobre 2026) : « ok pour le B200, lance le pilote maintenant ». Aucune paire de H100 SXM n'était libre ;
    # un B200 (180 Go) porte le modèle sur une seule carte, à 9,39 $/h ce jour-là.
    gpus:
      - {name: "B200"}
      - {name: "H100 SXM"}
    max_dph_per_gpu: 10.0
    expected_hours: 3
    download_gb: 190         # le mode service (décision 42) : Qwen3.5-122B-A10B-FP8 (127,2 Go) puis gemma-4-31B-it, l'autre famille (62,6 Go)

gated_model: meta-llama/Llama-3.1-8B-Instruct
